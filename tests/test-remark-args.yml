name: Test remark_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake wget to mock reviewdog download
        run: |
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-wget.sh" /tmp/fake-bin/wget
          chmod +x /tmp/fake-bin/wget
          echo "FAKE_INSTALL_SCRIPT=$GITHUB_WORKSPACE/tests/fixtures/fake-reviewdog-install.sh" >> "$GITHUB_ENV"
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          workdir: tests/fixtures/remark-args-test
          remark_args: "--use=remark-preset-lint-recommended"
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: warning
        continue-on-error: true

      - name: Assert action completed with custom remark_args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: remark-lint action completed with custom remark_args"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness constraints)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
