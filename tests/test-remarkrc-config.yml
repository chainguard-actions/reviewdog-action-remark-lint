name: Test .remarkrc config overrides default preset
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: tests/fixtures/remarkrc
          reporter: local
          filter_mode: nofilter
          fail_level: any
          install_deps: "false"
      - name: Assert success (no rules enabled by .remarkrc)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success since .remarkrc enables no rules"
            exit 1
          fi
          echo "PASS"
