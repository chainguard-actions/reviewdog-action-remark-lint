name: Test basic remark-lint usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workdir: testdata
          reporter: local
          filter_mode: nofilter
          fail_level: none
          install_deps: "true"
          github_token: ${{ github.token }}
      - name: Assert action completed successfully
        run: |
          echo "PASS: remark-lint action completed without error on testdata directory"
