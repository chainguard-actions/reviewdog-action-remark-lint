name: Test lint errors fail with fail_level any
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          workdir: tests/fixtures/bad
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert action failed due to lint findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because of lint errors"
            exit 1
          fi
          echo "PASS"
      - name: Confirm remark reports issues for the fixture
        working-directory: tests/fixtures/bad
        run: |
          OUT="$(remark . --use=remark-preset-lint-recommended 2>&1 || true)"
          echo "$OUT"
          if ! echo "$OUT" | grep -qiE 'warning'; then
            echo "FAIL: expected remark warnings for bad fixture"
            exit 1
          fi
          echo "PASS"
