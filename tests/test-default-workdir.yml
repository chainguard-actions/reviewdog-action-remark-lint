name: Test remark-lint with default workdir and remark_args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test markdown directory with config
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/md-default"
          cat > "${GITHUB_WORKSPACE}/md-default/hello.md" << 'EOF'
          # Hello World

          This is a simple markdown file with valid content.

          ## Section One

          Some content here.
          EOF
          cat > "${GITHUB_WORKSPACE}/md-default/.remarkrc.json" << 'EOF'
          {
            "plugins": ["remark-preset-lint-recommended"]
          }
          EOF
      - id: action
        uses: .
        with:
          workdir: md-default
          reporter: local
          filter_mode: nofilter
          fail_level: none
          install_deps: "false"
          github_token: ${{ github.token }}
      - name: Assert action completed successfully
        run: |
          echo "PASS: remark-lint action completed with custom workdir and config"
