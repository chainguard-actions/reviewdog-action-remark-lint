name: Test remark-lint with existing .remarkrc config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run remark-lint action with committed .remarkrc.yaml config
        id: action
        uses: .
        with:
          workdir: testdata
          reporter: local
          filter_mode: nofilter
          fail_level: none
          install_deps: "true"
          github_token: dummy-token

      - name: Assert action completed successfully with remarkrc
        run: |
          echo "Action completed with .remarkrc.yaml config"
          echo "PASS"
