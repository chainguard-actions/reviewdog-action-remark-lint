name: Test remark-lint with default preset
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          workdir: tests/fixtures/simple
          reporter: local
          filter_mode: nofilter
          fail_level: none
          fail_on_error: "false"
          install_deps: "false"
          remark_args: ""
        env:
          INPUT_GITHUB_TOKEN: dummy-token

      - name: Assert action ran successfully with default preset
        run: |
          echo "PASS: remark-lint ran with default preset without fatal error"
