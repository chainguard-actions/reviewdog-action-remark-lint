name: Test custom workdir with remarkrc config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install remark and set up fake wget
        run: |
          # Install remark tools globally so entrypoint skips npm install
          npm install -g remark-cli@10.0.0 remark-preset-lint-recommended@6.0.1 remark-lint@9.0.1

          # Set up fake wget that serves a no-op reviewdog installer
          mkdir -p /tmp/fake-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-wget.sh" /tmp/fake-bin/wget
          chmod +x /tmp/fake-bin/wget
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - name: Run remark-lint action with custom workdir (has .remarkrc.yaml)
        id: action
        uses: .
        with:
          workdir: tests/fixtures/custom-workdir
          reporter: local
          filter_mode: nofilter
          fail_level: none
          install_deps: "false"

      - name: Assert action completed successfully with custom workdir
        run: |
          echo "Action completed with custom workdir pointing to tests/fixtures/custom-workdir"
          echo "PASS"
