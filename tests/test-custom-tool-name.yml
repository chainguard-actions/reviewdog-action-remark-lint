name: Test custom tool name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a clean markdown file for linting
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/tool-name"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/tool-name/README.md" << 'EOF'
          # Hello World

          This is a clean markdown file for tool name test.

          ## Section

          Some content here.
          EOF

      - id: action
        uses: .
        with:
          workdir: tests/fixtures/tool-name
          tool_name: my-custom-remark-lint
          level: warning
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          install_deps: "false"
        continue-on-error: true

      - name: Assert action ran with custom tool name and level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom tool_name and level"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or API limits)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
