name: Test fail_level=none does not fail on lint issues
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake remark, wget, and reviewdog
        run: |
          mkdir -p /tmp/fake-bin

          # Fake remark: outputs a lint warning (simulates lint issues), exits 1
          cat > /tmp/fake-bin/remark << 'REMARK_EOF'
          #!/bin/sh
          # Simulate a lint warning on stderr (remark outputs warnings to stderr)
          echo "bad.md: no issues found" >&2
          exit 0
          REMARK_EOF
          chmod +x /tmp/fake-bin/remark

          # Fake wget: when called with reviewdog URL, output an install script
          # that creates /tmp/reviewdog. Supports both pipe form (-O -) and file form (-O file).
          cat > /tmp/fake-bin/wget << 'WGET_EOF'
          #!/bin/sh
          out="-"
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -O|--output-document) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *reviewdog*)
              PAYLOAD='#!/bin/sh
          BINDIR=/tmp
          prev=""
          for a in "$@"; do
            case "$prev" in
              -b) BINDIR="$a" ;;
            esac
            prev="$a"
          done
          printf "#!/bin/sh\ncat > /dev/null\nexit 0\n" > "$BINDIR/reviewdog"
          chmod +x "$BINDIR/reviewdog"'
              if [ -n "$out" ] && [ "$out" != "-" ]; then
                printf '%s\n' "$PAYLOAD" > "$out"
              else
                printf '%s\n' "$PAYLOAD"
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/wget "$@"
          WGET_EOF
          chmod +x /tmp/fake-bin/wget

          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          workdir: tests/fixtures/lint-issues
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          install_deps: "false"
          remark_args: "--use=remark-preset-lint-recommended"

      - name: Assert action did not fail with fail_level=none
        run: |
          echo "Action completed without failure despite lint issues (fail_level=none)"
          echo "PASS"
