name: Test install_deps with package.json present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a directory with package.json and markdown
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/install-deps"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/install-deps/package.json" << 'EOF'
          {
            "name": "test-remark",
            "version": "1.0.0",
            "remarkConfig": {
              "plugins": ["remark-preset-lint-recommended"]
            }
          }
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/install-deps/README.md" << 'EOF'
          # Hello World

          This is a markdown file for install deps test.

          ## Section

          Some content here.
          EOF

      - id: action
        uses: .
        with:
          workdir: tests/fixtures/install-deps
          install_deps: "true"
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
        continue-on-error: true

      - name: Assert action ran with install_deps enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with install_deps=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo or API limits)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
