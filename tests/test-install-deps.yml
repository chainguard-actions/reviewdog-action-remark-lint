name: Test install_deps=true with package.json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install remark globally
        run: |
          npm install -g remark-cli@10.0.0 remark-preset-lint-recommended@6.0.1 remark-lint@9.0.1

      - name: Set up fake reviewdog and wget mock
        run: |
          printf '%s\n' '#!/bin/sh' 'cat > /dev/null' 'exit 0' > /tmp/fake-reviewdog
          chmod +x /tmp/fake-reviewdog

          printf '%s\n' \
            '#!/bin/sh' \
            'bindir="/tmp"' \
            'while [ $# -gt 0 ]; do' \
            '  case "$1" in' \
            '    -b) bindir="$2"; shift 2 ;;' \
            '    *) shift ;;' \
            '  esac' \
            'done' \
            'cp /tmp/fake-reviewdog "$bindir/reviewdog"' \
            'chmod +x "$bindir/reviewdog"' \
            > /tmp/fake-install-reviewdog.sh
          chmod +x /tmp/fake-install-reviewdog.sh

          printf '%s\n' \
            '#!/bin/sh' \
            'out="-"' \
            'prev=""' \
            'for arg in "$@"; do' \
            '  case "$prev" in' \
            '    -O|--output-document) out="$arg" ;;' \
            '  esac' \
            '  prev="$arg"' \
            'done' \
            'case "$*" in' \
            '  *reviewdog*)' \
            '    if [ "$out" = "-" ]; then' \
            '      cat /tmp/fake-install-reviewdog.sh' \
            '    else' \
            '      cat /tmp/fake-install-reviewdog.sh > "$out"' \
            '    fi' \
            '    exit 0' \
            '    ;;' \
            'esac' \
            'exec /usr/bin/wget "$@"' \
            > /tmp/fake-wget
          chmod +x /tmp/fake-wget
          sudo cp /tmp/fake-wget /usr/local/bin/wget

      - name: Run remark-lint with install_deps=true
        id: action
        uses: .
        with:
          workdir: tests/fixtures/install-deps
          reporter: github-check
          filter_mode: nofilter
          fail_level: none
          install_deps: "true"

      - name: Assert action completed successfully with deps installed
        run: |
          echo "PASS: remark-lint action with install_deps=true completed without error"
