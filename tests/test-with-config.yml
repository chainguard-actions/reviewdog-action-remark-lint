name: Test remark-lint with existing config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          workdir: testdata
          install_deps: "false"
          reporter: "local"
          filter_mode: "nofilter"
          fail_level: "none"
          github_token: ${{ github.token }}

      - name: Assert action completed successfully with config file
        run: |
          echo "PASS: remark-lint action completed with .remarkrc.yaml config"
